<!DOCTYPE html>
<html lang="en">
<head>

<script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observer Credential | NEORUINS™</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --gold:#c9a227; --cream:#e8e0d0; --dim:#a09a8c; --bg:#0b0a08; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--cream); font-family:Georgia,serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:32px 16px; }
  h1 { font-size:22px; letter-spacing:4px; color:var(--gold); margin-bottom:6px; font-weight:normal; }
  .sub { font-family:monospace; font-size:11px; color:var(--dim); letter-spacing:2px; margin-bottom:24px; text-align:center; line-height:1.8; }
  #cardWrap { max-width:900px; width:100%; }
  canvas { width:100%; height:auto; display:block; border:1px solid rgba(201,162,39,.25); }
  .actions { margin-top:20px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  button { background:var(--gold); color:#000; border:none; font-family:monospace; font-size:12px; letter-spacing:2px; font-weight:700; padding:14px 28px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--gold); border:1px solid var(--gold); }
  button:disabled { opacity:.4; cursor:default; }
  #gate { text-align:center; padding:60px 20px; font-family:monospace; color:var(--dim); font-size:13px; line-height:2; }
  #gate button { margin-top:16px; }
  .note { margin-top:28px; max-width:900px; font-family:monospace; font-size:11px; color:var(--dim); line-height:2; letter-spacing:1px; text-align:center; }
</style>
</head>
<body>
  <h1>OBSERVER CREDENTIAL</h1>
  <p class="sub">YOUR PERSONAL ARCHIVE IDENTIFICATION &mdash; RENDERED FROM YOUR OBSERVER ACCOUNT</p>

  <div id="gate" style="display:none">
    SIGN-IN REQUIRED<br>Your credential is generated from your observer account.
    <br><button id="gateSignIn">SIGN IN</button>
  </div>

  <div id="cardWrap" style="display:none">
    <canvas id="card" width="1200" height="750"></canvas>
    <div class="actions">
      <button id="dlBtn">DOWNLOAD CARD (PNG)</button>
      <button id="reBtn" class="ghost">RE-RENDER</button>
    </div>
  </div>

  <p class="note">SHARE IT ANYWHERE &mdash; X, DISCORD, REDDIT. YOUR CODENAME, YOUR CLEARANCE, YOUR RECORD.<br>THE CARD UPDATES AS YOUR SCORE GROWS.</p>

<script src="auth.js"></script>
<script>
function earnedClearance(score) {
  if (score >= 700) return 'SENIOR OBSERVER';
  if (score >= 350) return 'SIGNAL ANALYST';
  if (score >= 150) return 'ARCHIVE SCANNER';
  if (score >= 50)  return 'FIELD OBSERVER';
  return 'OBSERVER';
}

function cardNumber(uid) {
  const h = (uid || '00000000').replace(/-/g,'').toUpperCase();
  return 'NRC-' + (h.slice(0,4)||'0000') + '-' + (h.slice(4,8)||'0000');
}

function drawCard({ codename, clearance, score, vaults, relics, discoveries, cardNo, issued }) {
  const c = document.getElementById('card');
  const x = c.getContext('2d');
  const W = 1200, H = 750;
  const GOLD = '#c9a227', CREAM = '#e8e0d0', DIM = '#8a8478';

  // background
  x.fillStyle = '#0b0a08'; x.fillRect(0,0,W,H);

  // faint background motif: concentric archive rings
  x.strokeStyle = 'rgba(201,162,39,0.06)'; x.lineWidth = 2;
  for (let r = 120; r < 700; r += 90) {
    x.beginPath(); x.arc(W/2, H/2, r, 0, Math.PI*2); x.stroke();
  }
  // faint corner glyphs (geometric, decorative)
  x.fillStyle = 'rgba(201,162,39,0.10)';
  x.font = '120px Georgia';
  x.textAlign = 'center';
  x.fillText('◈', 110, 160); x.fillText('◈', W-110, 160);
  x.fillText('◈', 110, H-80); x.fillText('◈', W-110, H-80);

  // vignette
  const vg = x.createRadialGradient(W/2,H/2,200, W/2,H/2,700);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  x.fillStyle = vg; x.fillRect(0,0,W,H);

  // frames
  x.strokeStyle = GOLD; x.lineWidth = 3; x.strokeRect(26,26,W-52,H-52);
  x.strokeStyle = 'rgba(201,162,39,0.35)'; x.lineWidth = 1; x.strokeRect(40,40,W-80,H-80);

  // header
  x.textAlign = 'center'; x.fillStyle = GOLD;
  x.font = '28px Georgia'; 
  x.fillText('N E O R U I N S ™   C H R O N I C L E S', W/2, 108);
  x.strokeStyle = 'rgba(201,162,39,0.5)'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(300,132); x.lineTo(W-300,132); x.stroke();

  x.fillStyle = DIM; x.font = '19px monospace';
  x.fillText('O B S E R V E R   C R E D E N T I A L', W/2, 168);

  // codename
  x.fillStyle = CREAM; x.font = 'bold 76px Georgia';
  x.fillText(codename || 'UNNAMED', W/2, 268);

  // clearance
  x.fillStyle = GOLD; x.font = '30px Georgia';
  x.fillText('CLEARANCE — ' + clearance, W/2, 322);
  x.fillStyle = DIM; x.font = '17px monospace';
  x.fillText('PROGRESS SCORE ' + score, W/2, 356);

  // divider
  x.strokeStyle = 'rgba(201,162,39,0.4)';
  x.beginPath(); x.moveTo(220,398); x.lineTo(W-220,398); x.stroke();

  // stats
  const stats = [
    ['VAULTS UNLOCKED', vaults],
    ['RELIC CARDS', relics],
    ['DISCOVERIES', discoveries],
  ];
  x.textAlign = 'center';
  stats.forEach((s,i) => {
    const cx = W/2 + (i-1)*300;
    x.fillStyle = GOLD; x.font = 'bold 52px Georgia';
    x.fillText(String(s[1]), cx, 478);
    x.fillStyle = DIM; x.font = '16px monospace';
    x.fillText(s[0], cx, 512);
  });

  // footer
  x.textAlign = 'left'; x.fillStyle = DIM; x.font = '17px monospace';
  x.fillText(cardNo, 80, H-84);
  x.textAlign = 'center';
  x.fillText('THE ARCHIVE REMEMBERS', W/2, H-84);
  x.textAlign = 'right';
  x.fillText('ISSUED ' + issued, W-80, H-84);
}

async function render() {
  await ObserverAuth.init();
  const gate = document.getElementById('gate');
  const wrap = document.getElementById('cardWrap');
  if (!ObserverAuth.user) {
    gate.style.display = 'block'; wrap.style.display = 'none';
    return;
  }
  gate.style.display = 'none'; wrap.style.display = 'block';
  const profile = ObserverAuth.profile || await ObserverAuth.loadProfile() || {};
  const prog = await ObserverAuth.getProgress() || { vaults:[], relicCards:[], discoveries:[] };
  const score = profile.score || 0;
  const codename = profile.codename || 'OBSERVER-' + (ObserverAuth.user.id||'').slice(0,4).toUpperCase();
  const issued = profile.created_at
    ? new Date(profile.created_at).toISOString().slice(0,10)
    : new Date().toISOString().slice(0,10);
  drawCard({
    codename,
    clearance: earnedClearance(score),
    score,
    vaults: prog.vaults.length,
    relics: prog.relicCards.length,
    discoveries: prog.discoveries.length,
    cardNo: cardNumber(ObserverAuth.user.id),
    issued,
  });
  document.getElementById('dlBtn').disabled = false;
}

document.getElementById('gateSignIn').addEventListener('click', () => {
  document.querySelector('[data-obs-auth]')?.click();
});
document.getElementById('dlBtn').addEventListener('click', () => {
  const c = document.getElementById('card');
  const name = 'neoruins-credential-' + ((ObserverAuth.profile||{}).codename || 'observer').toLowerCase() + '.png';
  c.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
});
document.getElementById('reBtn').addEventListener('click', render);

// wait for webfonts, then render
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(render); }
else { render(); }
</script>
</body>
</html>
